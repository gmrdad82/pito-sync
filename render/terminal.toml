app = "pito-sync"
bin = "feed"
grid = [100, 14]
frame = "window"
prompt = "$ "
typing = "40ms"

[build]
command = "cargo build --release --locked --example feed"
bin_dir = "{target}/release/examples"

[env]
HOME = "home"
XDG_STATE_HOME = ""
TMPDIR = "temp"
NO_COLOR = "1"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.feed]
kind = "clip"
line = "The feed example: a source on its own thread, a token handed in after start, three resyncs, one of them failing while the rows stay, and a UI that only reads"
tape = "render/terminal/feed.tape"
launch = "export PATH={bin}:$PATH && clear"
settle = "400ms"

[shots.private]
kind = "clip"
line = "The database stays private: the feed example builds its file 0600 in a 0700 folder, and the next open puts both back after a chmod"
tape = "render/terminal/private.tape"
launch = "export PATH={bin}:$PATH && clear"
settle = "400ms"
